name: Check GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Check Pages build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          {
            echo "PAGES"
            gh api "repos/${GITHUB_REPOSITORY}/pages"
            echo "BUILD"
            gh api "repos/${GITHUB_REPOSITORY}/pages/builds/latest"
            echo "BUILD LOG"
            gh api "repos/${GITHUB_REPOSITORY}/pages/builds/latest/logs"
            echo "REQUEST"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
          } > .github/pages-setup-status.txt 2>&1
          sleep 30
          curl -Ls -H 'Cache-Control: no-cache' "https://spadardtubmanhc385-oss.github.io/LJT-Homepage/?check=$(date +%s)" -o .github/homepage-project.html
          {
            echo "CANONICAL"
            grep -o '<link rel="canonical"[^>]*>' .github/homepage-project.html
            echo "ASSETS"
            grep -o 'href="[^"]*assets/css/main.css"' .github/homepage-project.html
            echo "AVATAR"
            grep -o 'author__avatar' .github/homepage-project.html
            echo "SECTIONS"
            grep -o -E 'About Me|Academic Background|Research Experience|Skills|Publications|SynLogic|Contact' .github/homepage-project.html
          } >> .github/pages-setup-status.txt 2>&1
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git add .github/pages-setup-status.txt .github/homepage-project.html
          git commit -m "Record Pages build check"
          git push origin HEAD:master
