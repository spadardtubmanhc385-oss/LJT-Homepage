name: Check GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Check deployed pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          base="https://spadardtubmanhc385-oss.github.io/LJT-Homepage"
          query="check=$(date +%s)"
          {
            echo "PAGES"
            gh api "repos/${GITHUB_REPOSITORY}/pages"
            echo "BUILD"
            gh api "repos/${GITHUB_REPOSITORY}/pages/builds/latest"
            echo "REQUEST"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
          } > .github/pages-setup-status.txt 2>&1
          sleep 30
          curl -Ls -H 'Cache-Control: no-cache' "${base}/?${query}" -o .github/homepage-project.html
          curl -Ls -H 'Cache-Control: no-cache' "${base}/publications/?${query}" -o .github/publications.html
          curl -Ls -H 'Cache-Control: no-cache' "${base}/sitemap.xml?${query}" -o .github/sitemap.xml
          {
            for path in "" "publications/" "about/" "cv/" "talks/" "teaching/" "portfolio/" "markdown/" "sitemap/" "categories/" "tags/" "year-archive/" "404.html"; do
              echo "PATH /${path}"
              curl -Ls -o /dev/null -w '%{http_code}\n' "${base}/${path}?${query}"
            done
            echo "HOMEPAGE PUBLICATIONS"
            grep -o -E 'SynLogic|On the Perception Bottleneck|On the Universal Truthfulness|In-Context Sharpness|C-Eval|Composing Parameter-Efficient' .github/homepage-project.html
            echo "PUBLICATIONS PAGE"
            grep -o -E 'SynLogic|On the Perception Bottleneck|On the Universal Truthfulness|In-Context Sharpness|C-Eval|Composing Parameter-Efficient' .github/publications.html
            echo "SITEMAP"
            cat .github/sitemap.xml
          } >> .github/pages-setup-status.txt 2>&1
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git add .github/pages-setup-status.txt .github/homepage-project.html .github/publications.html .github/sitemap.xml
          git commit -m "Record final Pages checks"
          git push origin HEAD:master